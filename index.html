<title>FluTour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a deep-blue shoreline hero with layered waves taken from the logo, a search card above it,
   then white-surface listing cards on a cool pale ground. Cyan is the only accent; blue carries structure. */
:root{
  --royal:#043A8B; --deep:#052A68; --abyss:#031C47; --cyan:#08A9E9; --sky:#9ADBF7;
  --bg:#F1F6FC; --surface:#FFFFFF; --surface-2:#E6EEF9; --fg:#0A1E45; --muted:#4B5F82; --line:#D3DFF0;
  --link:#043A8B; --btn-bg:#043A8B; --btn-fg:#FFFFFF; --btn-hover:#052A68;
  --ring:#08A9E9; --ok:#0B7A55; --ok-bg:#DDF4EA; --warn:#8F4B00; --warn-bg:#FFEBCF; --bad:#A62A2A; --bad-bg:#FBE3E3;
  --shadow:0 1px 2px rgba(5,42,104,.08),0 10px 28px rgba(5,42,104,.09);
  --font-display:'Bricolage Grotesque','Trebuchet MS','Segoe UI',sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061330; --surface:#0B1F47; --surface-2:#10295A; --fg:#E8F0FD; --muted:#9DB2D6; --line:#1B3568;
    --link:#6CCBF4; --btn-bg:#08A9E9; --btn-fg:#031C47; --btn-hover:#3BBDF1;
    --ok:#58D6A4; --ok-bg:#0E3A33; --warn:#F6BB6A; --warn-bg:#3A2A10; --bad:#FF9C9C; --bad-bg:#432024;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#061330; --surface:#0B1F47; --surface-2:#10295A; --fg:#E8F0FD; --muted:#9DB2D6; --line:#1B3568;
  --link:#6CCBF4; --btn-bg:#08A9E9; --btn-fg:#031C47; --btn-hover:#3BBDF1;
  --ok:#58D6A4; --ok-bg:#0E3A33; --warn:#F6BB6A; --warn-bg:#3A2A10; --bad:#FF9C9C; --bad-bg:#432024;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}

/* notice + header */
.notice{background:var(--abyss);color:#BFD6F3;font-size:.8rem;text-align:center;padding:7px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--fg)}
.brand img{width:40px;height:40px;border-radius:50%}
.word{font-family:var(--font-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.word b{color:var(--cyan);font-weight:800}
.nav{display:flex;align-items:center;gap:8px}
.navlink{display:flex;align-items:center;gap:6px;background:none;border:0;min-height:44px;padding:0 10px;font-weight:600;border-radius:10px;color:var(--fg)}
.navlink:hover{background:var(--surface-2)}
.count{background:var(--btn-bg);color:var(--btn-fg);border-radius:999px;font-size:.75rem;min-width:22px;padding:1px 6px;text-align:center;font-weight:700}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;min-height:36px;padding:0 11px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(5,42,104,.18)}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-weight:700;text-decoration:none}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-lg{min-height:54px;font-size:1.05rem}
.btn-sm{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.linkbtn:hover{text-decoration:underline}
.ic{width:20px;height:20px;flex:none}
.ic.sm{width:16px;height:16px}
label.field,.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;color:var(--fg)}
textarea.input{padding:10px 12px;min-height:92px;resize:vertical}
.input:focus{border-color:var(--cyan)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:.85rem;min-height:1.1em}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px}
.stepper button{width:46px;align-self:stretch;border:0;background:none;font-size:1.3rem;font-weight:700;color:var(--link);border-radius:8px}
.stepper button:hover{background:var(--surface-2)}
.stepper output{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;background:linear-gradient(180deg,var(--abyss) 0%,var(--deep) 55%,var(--royal) 100%);color:#fff;overflow:hidden;padding-top:46px;padding-bottom:104px}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;position:relative;z-index:1}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin-bottom:14px}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.5rem);font-weight:800;max-width:19ch}
.lede{margin-top:16px;max-width:52ch;color:#CFE1F7;font-size:1.08rem}
.hero-logo{width:min(300px,28vw);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.07),0 0 0 22px rgba(8,169,233,.12)}
.hero-waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:64px;display:block}
.hero .wrap.sw{position:relative;z-index:2;margin-top:34px}
.search{background:var(--surface);color:var(--fg);border-radius:18px;box-shadow:var(--shadow);padding:6px 18px 18px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;min-height:54px;padding:0 6px;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--cyan)}
.tab .ic{width:24px;height:24px}
.fields{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:end}

/* sections */
.section{padding-block:52px 0}
.section h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700}
.section .sub{color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:22px}
.tile{position:relative;display:block;text-align:left;border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);color:var(--fg)}
.tile .art{aspect-ratio:3/2}
.tile .art>svg,.card .art>svg,.hero-cover>svg,.mini>svg,.top-art>svg{width:100%;height:100%;display:block}
.tile .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.tile .meta b{font-family:var(--font-display);font-size:1.12rem}
.tile .meta span{color:var(--muted);font-size:.9rem}
.tile:hover{transform:translateY(-2px)}
.tile{transition:transform .15s ease}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
.dest button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.dest button:hover{border-color:var(--cyan)}
.dest b{font-family:var(--font-display);font-size:1.2rem}
.dest span{color:var(--muted);font-size:.9rem}
.dest .ic{color:var(--cyan)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px;counter-reset:s}
.step{background:var(--surface-2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.step i{font-style:normal;font-family:var(--font-mono);font-weight:500;color:var(--link);font-size:.85rem}
.step b{font-family:var(--font-display);font-size:1.15rem}
.step span{color:var(--muted)}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.trust div{display:flex;gap:12px;align-items:flex-start}
.trust .ic{color:var(--cyan);width:26px;height:26px;margin-top:2px}
.trust b{display:block}
.trust span{color:var(--muted);font-size:.95rem}
.footer{margin-top:64px;background:var(--abyss);color:#BFD6F3;padding-block:34px}
.footer .wrap{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.footer .brand{color:#fff}
.footer p{max-width:62ch;font-size:.9rem}

/* cards */
.card{display:grid;grid-template-columns:260px minmax(0,1fr) 210px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.card .art{position:relative;min-height:190px}
.card .art>svg{position:absolute;inset:0;height:100%}
.chip{position:absolute;left:10px;top:10px;background:var(--cyan);color:#031C47;font-weight:700;font-size:.75rem;border-radius:999px;padding:3px 10px}
.chip.city{top:auto;bottom:10px;background:rgba(3,28,71,.78);color:#fff;display:flex;align-items:center;gap:5px}
.card .body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:1.25rem;font-weight:700}
.op{color:var(--muted);font-size:.92rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.9rem}
.facts span{display:inline-flex;align-items:center;gap:6px}
.ticks{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.ticks li{display:flex;gap:8px;align-items:flex-start}
.ticks .ic{color:var(--ok);width:18px;height:18px;margin-top:2px}
.side{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;align-items:flex-end;text-align:right}
.rating{display:flex;align-items:center;gap:8px}
.rating .t{display:flex;flex-direction:column;line-height:1.2;font-size:.85rem;color:var(--muted)}
.rating .t b{color:var(--fg);font-size:.95rem}
.score{background:var(--btn-bg);color:var(--btn-fg);border-radius:10px 10px 10px 2px;font-weight:700;padding:5px 9px;font-variant-numeric:tabular-nums}
.price small{display:block;color:var(--muted);font-size:.82rem}
.price b{font-family:var(--font-display);font-size:1.6rem;font-weight:800;display:block;line-height:1.1}
.avail{font-size:.82rem;font-weight:600;color:var(--ok)}
.avail.low{color:var(--warn)}
.avail.none{color:var(--bad)}
.cards{display:flex;flex-direction:column;gap:16px}

/* results */
.sumbar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:22px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:end}
.rtabs{display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:thin}
.rtab{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:42px;padding:0 16px;font-weight:600}
.rtab .ic{width:20px;height:20px}
.rtab[aria-selected="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.rgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
.filters h3{font-size:1.05rem}
.fg{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.fg legend{padding:0;margin-bottom:8px;font-weight:700;font-size:.92rem}
.opt{display:flex;align-items:center;gap:10px;min-height:34px;font-size:.95rem}
.opt input{width:19px;height:19px;accent-color:var(--royal)}
.range{width:100%;accent-color:var(--cyan)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rhead h2{font-size:1.35rem}
.rtools{display:flex;gap:10px;align-items:center}
.filter-toggle{display:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-size:1.2rem}
.empty p{color:var(--muted);max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* detail */
.crumb{padding-top:20px}
.hero-cover{position:relative;height:clamp(180px,30vw,300px);border-radius:18px;overflow:hidden;margin-top:12px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;margin-top:22px;align-items:start}
.dhead h1{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800}
.dhead .facts{margin-top:10px;font-size:.95rem}
.block{margin-top:30px}
.block h2{font-size:1.25rem;margin-bottom:10px}
.block p{color:var(--muted);max-width:68ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:16px}
.panel .from{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel .from b{font-family:var(--font-display);font-size:1.9rem;font-weight:800}
.panel .from span{color:var(--muted);font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:56px;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.slot small{font-weight:600;font-size:.72rem;color:var(--ok)}
.slot.few small{color:var(--warn)}
.slot:hover:not(:disabled){border-color:var(--cyan)}
.slot[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.slot[aria-pressed="true"] small{color:inherit}
.slot:disabled{opacity:.5;cursor:not-allowed;text-decoration:line-through}
.slot:disabled small{text-decoration:none;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px;font-size:.95rem}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.lines .tot span:last-child{font-family:var(--font-display);font-size:1.4rem}
.hint{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint .ic{color:var(--ok);width:18px;height:18px;margin-top:1px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem}

/* checkout */
.steps-bar{display:flex;gap:8px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.sb{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:.92rem}
.sb i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-size:.8rem;font-family:var(--font-mono)}
.sb.on{color:var(--fg)}
.sb.on i{background:var(--btn-bg);color:var(--btn-fg)}
.sb.done i{background:var(--ok-bg);color:var(--ok)}
.sb-line{width:28px;height:2px;background:var(--line)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;margin-top:14px;align-items:start}
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.form h2{font-size:1.3rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pay{display:flex;flex-direction:column;gap:10px}
.payopt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.payopt:has(input:checked){border-color:var(--cyan);background:var(--surface-2)}
.payopt input{margin-top:4px;accent-color:var(--royal);width:18px;height:18px}
.payopt b{display:block}
.payopt span{color:var(--muted);font-size:.9rem}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.summary .mini{height:120px;position:relative}
.summary .in{padding:18px;display:flex;flex-direction:column;gap:14px}
.summary h3{font-size:1.15rem}
.kv{display:flex;flex-direction:column;gap:6px;font-size:.93rem;color:var(--muted)}
.kv span{display:flex;gap:8px;align-items:center}
.kv .ic{color:var(--cyan)}

/* confirmation + bookings */
.done{max-width:760px;margin:34px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.done .top-art{height:130px;position:relative}
.done .in{padding:26px;display:flex;flex-direction:column;gap:18px}
.okmark{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ok-bg);color:var(--ok);margin-top:-52px;position:relative;border:4px solid var(--surface);box-sizing:content-box}
.okmark .ic{width:28px;height:28px}
.ref{font-family:var(--font-mono);font-weight:500;font-size:1.5rem;letter-spacing:.06em;background:var(--surface-2);border-radius:10px;padding:8px 14px;display:inline-block}
.next{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.next li{display:flex;gap:10px;color:var(--muted)}
.next .ic{color:var(--cyan);margin-top:2px}
.bk{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.bk .mini{position:relative;min-height:130px}
.bk .mini>svg{position:absolute;inset:0;height:100%}
.bk .in{padding:14px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.bk .act{padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:space-between;text-align:right}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--ok-bg);color:var(--ok)}
.pill.off{background:var(--bad-bg);color:var(--bad)}
.adm-badge{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--warn-bg);color:var(--warn);letter-spacing:.04em}
.adm-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.adm-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px;display:flex;flex-direction:column;gap:3px;min-width:130px}
.adm-n{font-family:var(--font-display);font-size:1.55rem;font-weight:800;color:var(--fg)}
.adm-l{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.page-h{padding-top:28px}
.page-h h1{font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:800}

.sp3{grid-column:span 3}.sp4{grid-column:span 4}.sp6{grid-column:span 6}
.field>.fhint{text-transform:none;letter-spacing:0;font-weight:400;font-size:.8rem}
@media (max-width:1020px){
  .sp3,.sp4,.sp6{grid-column:span 6}
  .fields .btn{grid-column:1/-1}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .dgrid,.cgrid{grid-template-columns:minmax(0,1fr)}
  .panel,.summary{position:static}
  .rgrid{grid-template-columns:minmax(0,1fr)}
  .filters{position:static;display:none}
  .filters.open{display:flex}
  .filter-toggle{display:inline-flex}
}
@media (max-width:760px){
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .hero-logo{display:none}
  .hero{padding-top:30px;padding-bottom:92px}
  .tabs{grid-template-columns:repeat(2,1fr)}
  .tab{border:0;border-bottom:3px solid transparent}
  .tab:last-child{grid-column:1/-1}
  .sp3,.sp4,.sp6{grid-column:1/-1}
  .half{grid-column:span 6}
  .card{grid-template-columns:minmax(0,1fr)}
  .card .art{min-height:150px;aspect-ratio:16/7}
  .side{border-left:0;border-top:1px solid var(--line);flex-direction:row;align-items:center;text-align:left;flex-wrap:wrap}
  .steps,.trust,.two,.grid2{grid-template-columns:minmax(0,1fr)}

  .bk .mini{min-height:90px}
  .bk .in{padding:0 16px}
  .bk .act{flex-direction:row;align-items:center;text-align:left;flex-wrap:wrap}
  .word{font-size:1.3rem}
  .navlink span.lbl2{display:none}
}
@media (max-width:420px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button{padding:0 8px}
  .brand img{width:36px;height:36px}
  .word{font-size:1.2rem}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* pricing by visitor type */
.pricebar{background:var(--surface-2);border-bottom:1px solid var(--line)}
.pb-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.pb-lbl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.seg.wide{background:var(--surface);flex:1;max-width:620px;flex-wrap:wrap;gap:3px}
.seg.wide button{flex:1;min-width:170px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;font-size:.88rem;text-align:center;line-height:1.2}
.seg.wide button b{font-family:var(--font-mono);font-weight:500;font-size:.78rem;background:color-mix(in srgb,currentColor 14%,transparent);border-radius:6px;padding:1px 6px}
.seg.wide button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);box-shadow:none}
.tile .meta .from{margin-top:4px;color:var(--fg)}
.tile .meta .from b{font-family:var(--font-display);font-size:1.05rem}
.ratecard{margin-top:22px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.ratecard table{width:100%;border-collapse:collapse;min-width:600px}
.ratecard th,.ratecard td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.ratecard thead th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:700}
.ratecard tbody tr:last-child>*{border-bottom:0}
.ratecard td.num{font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.ratecard td.on{color:var(--link);background:color-mix(in srgb,var(--cyan) 11%,transparent)}
.ratecard td:last-child{color:var(--muted);font-size:.92rem}
.rt{display:flex;align-items:center;gap:10px;font-weight:700}
.rt .ic{color:var(--cyan);width:26px;height:26px}
.note.ok{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);color:var(--fg)}
.note .ic{flex:none;color:var(--cyan)}
@media (max-width:760px){.pb-lbl{width:100%}.seg.wide{max-width:none;width:100%}}

/* agent gate */
.gate-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:44px;align-items:center;position:relative;z-index:1}
.gate-copy .brand{color:#fff;margin-bottom:28px}
.gate-copy .brand img{width:56px;height:56px}
.gate-copy .word{font-size:2rem}
.gate-points{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;color:#CFE1F7;max-width:52ch}
.gate-points li{display:flex;gap:12px;align-items:flex-start}
.gate-points .ic{color:var(--cyan);margin-top:2px}
.gate-card{background:var(--surface);color:var(--fg);border-radius:20px;box-shadow:var(--shadow);padding:6px 22px 22px}
.gtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:18px}
.gform{display:flex;flex-direction:column;gap:14px}
.gfoot{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.fhint{font-size:.8rem;color:var(--muted)}
.agent-chip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;max-width:220px;min-width:0}
.agent-chip i{font-style:normal;flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);font-weight:700}
.chip-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash{background:var(--ok-bg);color:var(--ok);border-bottom:1px solid var(--line)}
.flash-in{display:flex;gap:10px;align-items:flex-start;padding-block:12px;font-weight:600}
.flash-in .ic{flex:none;margin-top:2px}
@media (max-width:1020px){.gate-in{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.chip-t{display:none}.gate-card{padding-inline:16px}}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function fmtDate(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function fmtTime(t){ var p=t.split(":"), h=+p[0], m=p[1]; return ((h%12)||12)+":"+m+" "+(h<12?"AM":"PM"); }
function hoursText(h){ return h+(h===1?" hour":" hours"); }
function hashStr(s){ var h=7; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function fmtMoney(v,cur){ return cur==="EGP" ? "EGP "+Math.round(v).toLocaleString("en-US") : "$"+Math.round(v).toLocaleString("en-US"); }
function money(v){ return fmtMoney(v,state.currency); }
function rateOf(l,cur){ return RATES[l.type][cur||state.currency]; }
function rateLabel(r){ return r>=4.8?"Exceptional":r>=4.6?"Excellent":r>=4.4?"Very good":"Good"; }
function plural(n,a,b){ return n+" "+(n===1?a:b); }
function score(l){ return l.rating*10+Math.min(l.reviews,600)/100; }

function loadBookings(email){
  return db.collection('bookings').where('agent','==',email).orderBy('createdAt','desc').get().then(function(snap){
    state.bookings=snap.docs.map(function(d){ var b=d.data(); b._id=d.id; return b; });
  }).catch(function(e){ console.error('loadBookings',e); state.bookings=[]; });
}
function loadAllBookings(){
  return db.collection('bookings').orderBy('createdAt','desc').get().then(function(snap){
    state.bookings=snap.docs.map(function(d){ var b=d.data(); b._id=d.id; return b; });
  }).catch(function(e){ console.error('loadAllBookings',e); state.bookings=[]; });
}

function slotInfo(l,date,t){
  if(date===todayISO){
    var n=new Date(), p=t.split(":"), mins=(+p[0])*60+(+p[1]), nowM=n.getHours()*60+n.getMinutes();
    if(mins<nowM+60) return {t:t,status:"past",left:0};
  }
  var h=hashStr(l.id+date+t)%10;
  if(h===0) return {t:t,status:"sold",left:0};
  if(h<=2) return {t:t,status:"few",left:h===1?2:3};
  return {t:t,status:"open",left:9};
}
function slotsFor(l,date){ return l.slots.map(function(t){ return slotInfo(l,date,t); }); }
function openCount(l,date){ return slotsFor(l,date).filter(function(s){return s.status==="open"||s.status==="few";}).length; }
function units(l,guests){ var T=TYPES[l.type]; return T.billing==="group"?Math.max(1,Math.ceil(guests/T.cap)):guests; }
function quote(l,guests,hours,cur){
  var T=TYPES[l.type], u=units(l,guests), r=rateOf(l,cur), total=r*hours*u;
  var who = T.billing==="group" ? plural(u,T.noun,T.noun+"s") : plural(u,"rider","riders");
  return {units:u,rate:r,total:total,line:who+" × "+hoursText(hours)+" at "+fmtMoney(r,cur||state.currency)+" per hour"};
}

/* ---------- trip + account helpers ---------- */
function toMin(t){ var p=t.split(":"); return (+p[0])*60+(+p[1]); }
function nearestSlot(l,date,time){
  var best=null, bd=1e9, tm=toMin(time);
  slotsFor(l,date).forEach(function(s){ if(s.status!=="open"&&s.status!=="few") return; var d=Math.abs(toMin(s.t)-tm); if(d<bd){ bd=d; best=s; } });
  return best;
}
function isAgent(){ return !!(state.session&&state.session.kind==="agent"); }
function isAdmin(){ return !!(state.session&&state.session.kind==="admin"); }
function myBookings(){
  if(isAdmin()) return state.bookings;
  if(!isAgent()) return [];
  return state.bookings.filter(function(b){ return b.agent===state.session.email; });
}
function setErrors(errs,ids,prefix){
  ids.forEach(function(id){
    var m=errs[id]||"", e=document.getElementById("e-"+prefix+id), i=document.getElementById(prefix+id);
    if(e) e.textContent=m; if(i) i.setAttribute("aria-invalid",String(!!m));
  });
  var first=ids.filter(function(id){ return errs[id]; })[0];
  if(first){ var el=document.getElementById(prefix+first); if(el) el.focus(); }
}

var _authBusy=false;
auth.onAuthStateChanged(function(user){
  if(_authBusy) return;
  if(user){
    db.collection('agents').doc(user.uid).get().then(function(doc){
      if(!doc.exists){ return auth.signOut(); }
      var ag=doc.data();
      var kind=ag.role==="admin"?"admin":"agent";
      state.session={kind:kind,uid:user.uid,email:user.email,agency:ag.agency,rep:ag.rep};
      var _lp=kind==="admin"?loadAllBookings():loadBookings(user.email); if(kind==="admin") startAdminLive(); return _lp;
    }).then(function(){
      if(state.view==="loading"||state.view==="gate") state.view="home";
      renderFooter(); render();
    }).catch(function(e){ console.error('auth',e); state.view="gate"; renderFooter(); render(); });
  } else {
    state.session=null; state.bookings=[];
    state.view="gate"; renderFooter(); render();
  }
});

function filtered(){
  var f=state.filters;
  var list=LISTINGS.filter(function(l){
    if(state.type!=="all" && l.type!==state.type) return false;
    if(state.area && l.area!==state.area) return false;
    if(l.rating<f.minRating) return false;
    if(f.dur==="one" && l.hours!==1) return false;
    if(f.dur==="more" && l.hours<2) return false;
    if(f.priv && !l.priv) return false;
    if(f.pickup && !l.pickup) return false;
    return true;
  });
  var s=state.sort;
  list.sort(function(a,b){
    if(s==="price") return rateOf(a)*a.hours-rateOf(b)*b.hours || score(b)-score(a);
    if(s==="rating") return b.rating-a.rating || b.reviews-a.reviews;
    return score(b)-score(a);
  });
  return list;
}

function clearAdminListeners(){_adminUnsubs.forEach(function(u){try{u();}catch(e){}});_adminUnsubs=[];}
function startAdminLive(){
  clearAdminListeners();

    state.pendingDrivers=snap.docs.map(function(d){var o=d.data();o.uid=d.id;return o;});
    if(state.view==='bookings'&&state.adminTab==='pending'){render();}
  }));
  _adminUnsubs.push(db.collection('drivers').where('status','==','approved').onSnapshot(function(snap){
    state.liveDrivers=snap.docs.map(function(d){var o=d.data();o.uid=d.id;return o;});
    if(state.view==='bookings'&&state.adminTab==='drivers'){render();}
    if(state.view==='bookings'&&state.adminTab==='map'){updateAdminMap();}
  }));
  _adminUnsubs.push(db.collection('trips').where('status','in',['accepted','in_progress','arrived']).onSnapshot(function(snap){
    state.activeTrips=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o;});
    if(state.view==='bookings'&&state.adminTab==='trips'){render();}
    if(state.view==='bookings'&&state.adminTab==='map'){updateAdminMap();}
  }));
  _adminUnsubs.push(db.collection('users').where('role','==','passenger').where('status','==','active').onSnapshot(function(snap){
    state.activePassengers=snap.docs.map(function(d){var o=d.data();o.uid=d.id;return o;});
    if(state.view==='bookings'&&state.adminTab==='passengers'){render();}
  }));
  rtdb.ref('drivers_location').on('value',function(snap){
    var locs=snap.val()||{};

function updateAdminMap(){
  if(!_adminMap)return;
  _adminMapMarkers.forEach(function(m){_adminMap.removeLayer(m);});
  _adminMapMarkers=[];
  state.liveDrivers.forEach(function(d){
    if(!d.lat||!d.lng)return;
    var c=d.isOnTrip?'#f97316':'#043A8B';
    var m=L.circleMarker([d.lat,d.lng],{radius:10,fillColor:c,color:'#fff',weight:2,fillOpacity:1}).bindTooltip((d.name||'Driver')+(d.isOnTrip?' \u2014 On Trip':' \u2014 Available'));
    m.addTo(_adminMap);_adminMapMarkers.push(m);
  });
  state.activeTrips.forEach(function(t){
    var lat=(t.pickupLat&&parseFloat(t.pickupLat)),lng=(t.pickupLng&&parseFloat(t.pickupLng));
    if(!lat||!lng)return;
    var m=L.circleMarker([lat,lng],{radius:8,fillColor:'#0B7A55',color:'#fff',weight:2,fillOpacity:1}).bindTooltip((t.passengerName||'Passenger')+' \u2192 '+(t.driverName||'Driver'));

/* ---------- render ---------- */
function render(){
  renderHeader();
  if(state.view==="loading"){ document.getElementById("app").innerHTML='<div style="display:flex;justify-content:center;align-items:center;min-height:60vh;color:var(--muted)"><p>Loading\u2026</p></div>'; return; }
  if(state.view!=="gate" && !isAgent() && !isAdmin()) state.view="gate";
  var v=state.view, html="";
  if(v==="gate") html=viewGate();
  else if(v==="home") html=flashHtml()+viewHome();
  else if(v==="results") html=viewResults();
  else if(v==="detail") html=viewDetail();
  else if(v==="checkout") html=viewCheckout();
  else if(v==="done") html=viewDone();
  else html=viewBookings();
  if(v==="home") state.flash=null;
  document.getElementById("app").innerHTML=html;
  if(v==="results") refreshList();
}
function go(v,noScroll){ state.view=v; render(); if(!noScroll) window.scrollTo(0,0); }
function resetFilters(){ state.filters=Object.assign({},DEFAULT_FILTERS); }

/* ---------- events ---------- */
var app=document.getElementById("app");
function onClick(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var a=t.dataset.act, d=t.dataset;
  if(a==="home"){ state.askCancel=null; go(isAgent()||isAdmin()?"home":"gate"); }
  else if(a==="gate"){ state.errors={}; go("gate"); }
  else if(a==="signout"){ state.errors={}; state.authTab="in"; clearAdminListeners(); auth.signOut(); }
  else if(a==="authtab"){ state.authTab=d.tab; state.errors={}; render(); }
  else if(a==="bookings"){ state.askCancel=null; go(isAgent()||isAdmin()?"bookings":"gate"); }
  else if(a==="admtab"){ state.adminTab=d.tab; render(); if(d.tab==='map') initAdminMap(); }
  else if(a==="approve-driver"){
    var uid=d.uid,name=d.name;
    if(!uid)return;
    db.collection('drivers').doc(uid).update({status:'approved'}).then(function(){
      var idx=state.pendingDrivers.findIndex(function(x){return x.uid===uid;});
      if(idx>-1) state.pendingDrivers.splice(idx,1);
      render();
      alert('Driver '+name+' approved!');
    }).catch(function(e){alert('Error: '+e.message);});
  }
  else if(a==="reject-driver"){
    var uid=d.uid,name=d.name;
    if(!uid||!confirm('Reject and remove '+name+'?'))return;
    db.collection('drivers').doc(uid).update({status:'rejected'}).then(function(){
      var idx=state.pendingDrivers.findIndex(function(x){return x.uid===uid;});
      if(idx>-1) state.pendingDrivers.splice(idx,1);
      render();
    }).catch(function(e){alert('Error: '+e.message);});
  }
  else if(a==="cur"){ state.currency=d.cur; var y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="type"){ state.type=d.type; document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-selected",String(b.dataset.type===state.type)); }); var lbl=document.getElementById("s-glbl"); if(lbl) lbl.textContent=whoLabel(); }
  else if(a==="browse"){ state.type=d.type; resetFilters(); go("results"); }
  else if(a==="area"){ state.type="all"; state.area=d.area; resetFilters(); go("results"); }
  else if(a==="rtype"){ state.type=d.type; render(); }
  else if(a==="step"){ var n=Math.min(40,Math.max(1,state.guests+(+d.d))); state.guests=n; document.querySelectorAll('output[id$="-guests"]').forEach(function(o){o.textContent=n;}); if(state.view==="results") refreshList(); }
  else if(a==="open"){ state.sel=BYID[d.id]; var ns=state.time?nearestSlot(state.sel,state.date,state.time):null; state.slot=ns?ns.t:null; state.hours=state.sel.hours; go("detail"); }
  else if(a==="back"){ go("results"); }
  else if(a==="back-detail"){ go("detail"); }
  else if(a==="slot"){ state.slot=d.slot; renderPanel(); }
  else if(a==="dstep"){ state.guests=Math.min(40,Math.max(1,state.guests+(+d.d))); renderPanel(); }
  else if(a==="hstep"){ state.hours=Math.min(6,Math.max(1,state.hours+(+d.d))); renderPanel(); }
  else if(a==="reserve"){ if(state.slot){ var f=state.form; f.pick=state.pickup||state.sel.meet; f.drop=state.dropoff||f.pick; f.ptime=state.slot; state.errors={}; go("checkout"); } }
  else if(a==="reset"){ resetFilters(); render(); }
  else if(a==="all-areas"){ state.area=""; render(); }
  else if(a==="all-types"){ state.type="all"; render(); }
  else if(a==="toggle-filters"){ state.filtersOpen=!state.filtersOpen; var fl=document.getElementById("filters"); fl.classList.toggle("open",state.filtersOpen); t.setAttribute("aria-expanded",String(state.filtersOpen)); }
  else if(a==="cancel-ask"){ state.askCancel=d.ref; render(); }
  else if(a==="cancel-no"){ state.askCancel=null; render(); }
  else if(a==="cancel-yes"){
  var cb=state.bookings.filter(function(b){ return b.ref===d.ref; })[0];
  if(cb&&cb._id) db.collection('bookings').doc(cb._id).update({status:'cancelled'}).catch(function(e){ console.error('cancel',e); });
  state.bookings.forEach(function(b){ if(b.ref===d.ref) b.status="cancelled"; });
  state.askCancel=null; render();
}
}
function onChange(e){
  var el=e.target, id=el.id||"", f=state.filters;
  if(id==="s-cur"){ state.currency=el.value; }
  else if(id==="s-date"||id==="r-date"){ if(el.value&&el.value>=todayISO){ state.date=el.value; if(state.view==="results") refreshList(); } else { el.value=state.date; } }
  else if(id==="s-time"||id==="r-time"){ state.time=el.value; if(state.view==="results") refreshList(); }
  else if(id==="a-show"){ ["a-password","a-confirm"].forEach(function(x){ var i=document.getElementById(x); if(i) i.type=el.checked?"text":"password"; }); }
  else if(id==="d-date"){ if(el.value&&el.value>=todayISO){ state.date=el.value; var ok=slotsFor(state.sel,state.date).some(function(s){return s.t===state.slot&&(s.status==="open"||s.status==="few");}); if(!ok) state.slot=null; } renderPanel(); }
  else if(el.name==="f-area"){ state.area=el.value; refreshList(); }
  else if(el.name==="f-rating"){ f.minRating=+el.value; refreshList(); }
  else if(el.name==="f-dur"){ f.dur=el.value; refreshList(); }
  else if(id==="f-priv"){ f.priv=el.checked; refreshList(); }
  else if(id==="f-pickup"){ f.pickup=el.checked; refreshList(); }
  else if(id==="sort"){ state.sort=el.value; refreshList(); }
  else if(el.name==="pay"){ state.pay=el.value; }
}
function onInput(e){
  var id=e.target.id||"", f=state.form, v=e.target.value, au=state.auth;
  if(id==="s-pick"||id==="r-pick") state.pickup=v;
  else if(id==="s-drop"||id==="r-drop") state.dropoff=v;
  else if(id==="a-rep") au.rep=v;
  else if(id==="a-agency") au.agency=v;
  else if(id==="a-license") au.license=v;
  else if(id==="a-phone") au.phone=v;
  else if(id==="a-email") au.email=v;
  else if(id==="c-name") f.name=v;
  else if(id==="c-email") f.email=v;
  else if(id==="c-phone") f.phone=v;
  else if(id==="c-company") f.company=v;
  else if(id==="c-pick") f.pick=v;
  else if(id==="c-drop") f.drop=v;
  else if(id==="c-ptime") f.ptime=v;
  else if(id==="c-notes") f.notes=v;
}
function makeRef(){ var s="", c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; for(var i=0;i<6;i++) s+=c.charAt(Math.floor(Math.random()*c.length)); return "FT-"+s; }
function startSession(ag,isNew){
  state.session={kind:ag.role==="admin"?"admin":"agent",email:ag.email,agency:ag.agency,rep:ag.rep};
  state.auth={rep:"",agency:"",license:"",phone:"",email:""}; state.errors={}; state.authTab="in";
  state.flash=isNew?'Account created for '+esc(ag.agency)+'. Your IATA code will be verified before full approval.':null;
  go("home");
}
function submitSignup(){
  var v=function(id){ var el=document.getElementById("a-"+id); return el?el.value:""; };
  var d={rep:v("rep").trim(),agency:v("agency").trim(),license:v("license").trim(),phone:v("phone").trim(),email:v("email").trim().toLowerCase()}, pw=v("password"), cf=v("confirm"), errs={};
  if(d.rep.length<2) errs.rep="Enter the name of the person signing up.";
  if(d.agency.length<2) errs.agency="Enter your travel agent name.";
  if(!/^[A-Za-z0-9][A-Za-z0-9 \/\-]{3,24}$/.test(d.license)) errs.license="Enter an IATA code or license number, 4 to 25 letters, numbers or dashes.";
  if(d.phone.replace(/[^0-9]/g,"").length<8) errs.phone="Enter a phone number with country code.";
  if(!EMAIL_RE.test(d.email)) errs.email="Enter an email address like name@agency.com.";
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw)) errs.password="Use at least 8 characters with a letter and a number.";
  if(cf!==pw) errs.confirm="The passwords do not match.";
  var ids=["rep","agency","license","phone","email","password","confirm"];
  setErrors(errs,ids,"a-");
  if(Object.keys(errs).length) return;
  var fe=document.getElementById("e-a-form");
  var btn=document.querySelector('#signup button[type="submit"]');
  if(btn) btn.disabled=true;
  _authBusy=true;
  auth.createUserWithEmailAndPassword(d.email,pw).then(function(cred){
    var ag={rep:d.rep,agency:d.agency,license:d.license,phone:d.phone,email:d.email,created:firebase.firestore.FieldValue.serverTimestamp()};
    return db.collection('agents').doc(cred.user.uid).set(ag).then(function(){ return ag; });
  }).then(function(ag){
    _authBusy=false;
    startSession(ag,true);
  }).catch(function(err){
    _authBusy=false;
    if(btn) btn.disabled=false;
    fe.textContent=err.code==="auth/email-already-in-use"?"An account with this email exists. Sign in instead.":"Could not create account. Please try again.";
  });
}
function submitSignin(){
  var email=(document.getElementById("a-email").value||"").trim().toLowerCase(), pw=document.getElementById("a-password").value, errs={};
  if(!EMAIL_RE.test(email)) errs.email="Enter the email you signed up with.";
  if(!pw) errs.password="Enter your password.";
  setErrors(errs,["email","password"],"a-");
  var fe=document.getElementById("e-a-form"); fe.textContent="";
  if(Object.keys(errs).length) return;
  var btn=document.querySelector('#signin button[type="submit"]');
  if(btn) btn.disabled=true;
  _authBusy=true;
  auth.signInWithEmailAndPassword(email,pw).then(function(cred){
    return db.collection('agents').doc(cred.user.uid).get();
  }).then(function(doc){
    if(!doc.exists) throw new Error('no-profile');
    var ag=doc.data();
    return (ag.role==="admin"?loadAllBookings():loadBookings(ag.email)).then(function(){ return ag; });
  }).then(function(ag){
    _authBusy=false;
    startSession(ag,false);
  }).catch(function(){
    _authBusy=false;
    if(btn) btn.disabled=false;
    fe.textContent="The email or password is not right. Check both and try again.";
  });
}
function onSubmit(e){
  var form=e.target;
  if(form.id==="signup"){ e.preventDefault(); submitSignup(); return; }
  if(form.id==="signin"){ e.preventDefault(); submitSignin(); return; }
  if(form.id==="search"){ e.preventDefault(); resetFilters(); go("results"); return; }
  if(form.id==="checkout"){
    e.preventDefault();
    var f=state.form, errs={}, l=state.sel;
    if(f.name.trim().length<2) errs.name="Enter the name of the person riding.";
    if(!EMAIL_RE.test(f.email.trim())) errs.email="Enter an email address like name@example.com.";
    if(f.phone.replace(/[^0-9]/g,"").length<8) errs.phone="Enter a number with country code so your guide can reach them.";
    if(f.pick.trim().length<2) errs.pick="Enter where the ride starts.";
    if(f.drop.trim().length<2) errs.drop="Enter where the ride ends.";
    if(!f.ptime) errs.ptime="Enter the pick-up time.";
    state.errors=errs;
    if(Object.keys(errs).length){
      render();
      var first=document.querySelector('[aria-invalid="true"]'); if(first) first.focus();
      return;
    }
    var q=quote(l,state.guests,state.hours), s=state.session, ag=isAgent()||isAdmin();
    var b={ref:makeRef(),lid:l.id,date:state.date,slot:state.slot,guests:state.guests,hours:state.hours,cur:state.currency,total:q.total,name:f.name.trim(),email:f.email.trim(),phone:f.phone.trim(),company:f.company.trim(),pick:f.pick.trim(),drop:f.drop.trim(),ptime:f.ptime,pay:state.pay,status:"confirmed",createdAt:Date.now(),agent:ag?s.email:"",agency:ag?s.agency:""};
    var T=TYPES[l.type]||{};
    var cbtn=document.querySelector('#checkout button[type="submit"]');
    if(cbtn) cbtn.disabled=true;
    db.collection('bookings').add(b).then(function(docRef){
      b._id=docRef.id;
      fetch('/.netlify/functions/send-email',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ref:b.ref,clientName:b.name,clientEmail:b.email,agentEmail:s.email,rideType:T.label||l.type,date:b.date,slot:b.slot,guests:b.guests,pick:b.pick,drop:b.drop,total:b.total,cur:b.cur,agency:b.agency})
      }).catch(function(e){ console.error('email',e); });
      state.bookings.unshift(b);
      state.last=b; state.errors={};
      if(cbtn) cbtn.disabled=false;
      go("done");
    }).catch(function(e){
      console.error('booking',e);
      if(cbtn) cbtn.disabled=false;
      var ef=document.getElementById('checkout-err');
      if(!ef){ ef=document.createElement('p'); ef.id='checkout-err'; ef.className='err'; var fm=document.getElementById('checkout'); if(fm) fm.appendChild(ef); }
      ef.textContent='Could not save booking. Please try again.';
    });
  }
}
app.addEventListener("click",onClick);
app.addEventListener("change",onChange);
app.addEventListener("input",onInput);
app.addEventListener("submit",onSubmit);
document.getElementById("hdr").addEventListener("click",onClick);

renderFooter();
render(); /* shows "Loading…" while onAuthStateChanged fires */
})();
</script>
